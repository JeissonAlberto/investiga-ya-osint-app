
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v110.0 — INVESTIGATOR ULTIMATE (Mr.Holmes)</title>
    <style>
        :root { --p: #00ff41; --bg: #020202; --card: #08080a; --border: #1a1a1c; --holmes: #f39c12; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'JetBrains Mono', monospace; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo { padding: 2rem 1.5rem; font-weight: 900; color: var(--holmes); border-bottom: 1px solid var(--border); text-align: center; font-size: 1.4rem; letter-spacing: 5px; }
        .nav { flex: 1; padding: 1.5rem; overflow-y: auto; }
        .nav-item { padding: 12px; margin-bottom: 6px; color: #555; cursor: pointer; font-size: 0.75rem; border-radius: 4px; border: 1px solid transparent; }
        .nav-item.active { background: #0a0a0a; color: var(--holmes); border-color: var(--holmes); }
        .main { flex: 1; display: flex; flex-direction: column; background: #050505; }
        .top-bar { height: 70px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; justify-content: space-between; }
        .content { flex: 1; padding: 2.5rem; overflow-y: auto; }
        .search-container { max-width: 1000px; margin: 0 auto; display: flex; gap: 15px; background: var(--card); padding: 2rem; border-radius: 8px; border: 1px solid var(--border); }
        input { flex: 1; background: #000; border: 1px solid #333; color: var(--holmes); padding: 1.2rem; outline: none; font-size: 1.1rem; }
        button { background: var(--holmes); color: #000; border: none; padding: 0 3rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; margin-top: 2rem; }
        .module { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .module-h { padding: 1rem; background: #111; border-bottom: 1px solid var(--border); font-size: 0.75rem; color: var(--holmes); font-weight: 900; }
        .module-b { padding: 1.5rem; font-size: 0.8rem; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #111; padding-bottom: 5px; }
        .label { color: #555; text-transform: uppercase; font-size: 0.65rem; }
        .val { color: #fff; font-weight: 600; }
        .terminal { background: #000; border: 1px solid #111; padding: 1.2rem; height: 180px; overflow-y: auto; color: #f39c12; font-size: 0.75rem; margin-top: 2rem; border-left: 5px solid var(--holmes); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">ARGOS_HOLMES</div>
        <div class="nav">
            <div class="nav-item active">● DETECTIVE_CORE</div>
            <div class="nav-item">● TARGET_PROFILING</div>
            <div class="nav-item">● METADATA_CRACKER</div>
            <div class="nav-item">● UNIVERSAL_OSINT</div>
        </div>
    </aside>
    <main class="main">
        <div class="top-bar">
            <div style="font-size:0.8rem">SESIÓN: <span style="color:var(--holmes)">JEISSON_ALBERTO</span></div>
            <div style="font-size:0.7rem; color:#444">ENGINE: <span style="color:var(--holmes)">MR_HOLMES_ULITMATE</span></div>
        </div>
        <div class="content">
            <div class="search-container">
                <input type="text" id="target-q" placeholder="CUALQUIER DATO PARA INVESTIGACIÓN PROFUNDA...">
                <button onclick="holmesInvestigate()">INVESTIGAR</button>
            </div>
            <div id="results-grid" class="grid"></div>
            <div class="terminal" id="log">
                [SYSTEM] ARGOS v110.0: Mr. Holmes Detective Engine Loaded.<br>
                [SYSTEM] Waiting for investigative parameters...
            </div>
        </div>
    </main>
    <script>
        async function holmesInvestigate() {
            const q = document.getElementById('target-q').value.trim();
            if(!q) return;
            const log = document.getElementById('log');
            const grid = document.getElementById('results-grid');
            
            log.innerHTML = `[HOLMES] Iniciando investigación deductiva sobre: ${q}<br>[*] Accediendo a nodos de huella digital profunda...`;
            
            // Simulación basada en Mr. Holmes logic para Jeisson Alberto
            setTimeout(() => {
                log.innerHTML += `<br>[+] Hallazgos en 4 dimensiones de inteligencia detectados.`;
                grid.innerHTML = `
                    <div class="module">
                        <div class="module-h">DATOS DE IDENTIDAD (DETECTIVE_MODE)</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">Sujeto:</span><span class="val">Jeisson A. Sarmiento</span></div>
                            <div class="data-row"><span class="label">Ubicación:</span><span class="val">Arauca, CO</span></div>
                            <div class="data-row"><span class="label">Ocupación:</span><span class="val">Soporte Técnico SENA</span></div>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">HUELLA DIGITAL (OSINT)</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">Repositorios:</span><span class="val">GitHub (Activo)</span></div>
                            <div class="data-row"><span class="label">Alias Detectados:</span><span class="val">JeissonAlberto, jasoll</span></div>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">FINANZAS & GOBIERNO</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">Contratos:</span><span class="val">1 Vigente ($34M)</span></div>
                            <div class="data-row"><span class="label">Salud:</span><span class="val">Nueva EPS (ACTIVO)</span></div>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">ESTADO SOCIAL</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">SIMIT:</span><span class="val">Paz y Salvo</span></div>
                            <div class="data-row"><span class="label">Sisbén:</span><span class="val" style="color:#ff3e3e">SIN_REGISTRO</span></div>
                        </div>
                    </div>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
