
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v25.0 — CONEXIÓN REAL SECOP II</title>
    <style>
        :root { --p: #00ff41; --bg: #0a0a0a; --c: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .box { border: 1px solid #333; padding: 20px; background: var(--c); margin-bottom: 20px; }
        .p { color: var(--p); font-weight: bold; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--p); color: var(--p); padding: 15px; font-size: 1.1rem; }
        button { background: var(--p); color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; }
        .results { display: none; margin-top: 20px; }
        .data-card { background: #000; border-left: 4px solid var(--p); padding: 15px; margin-bottom: 10px; font-size: 0.9rem; }
        .status { font-size: 0.8rem; color: #888; margin-bottom: 10px; }
        .error { color: #ff3e3e; border-color: #ff3e3e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 5px 0; border-bottom: 1px solid #222; }
        .label { color: #666; width: 140px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="p">ARGOS_v25.0 // DATOS_ABIERTOS_API</h1>
        
        <div class="box">
            <div class="status" id="st">ESPERANDO OBJETIVO (NIT O CEDULA)...</div>
            <div class="input-row">
                <input type="text" id="target" placeholder="NIT (ej: 860003020) o CEDULA">
                <button onclick="query()">SCAN_REAL</button>
            </div>
        </div>

        <div id="res" class="results">
            <div class="box">
                <h3 class="p">CONTRATOS ELECTRÓNICOS (API jbjy-vk9h)</h3>
                <div id="secop-data">Buscando...</div>
            </div>
            
            <div class="box">
                <h3 class="p">VERIFICACIÓN EXTERNA (SIMIT / ADRES)</h3>
                <div id="links"></div>
            </div>
        </div>
    </div>

    <script>
        async function query() {
            const val = document.getElementById('target').value.trim();
            if(!val) return;
            
            const resDiv = document.getElementById('res');
            const dataDiv = document.getElementById('secop-data');
            const st = document.getElementById('st');
            
            resDiv.style.display = "block";
            st.innerText = "CONECTANDO CON SOCRATA API FOUNDRY...";
            dataDiv.innerHTML = "Consultando base de datos nacional...";

            try {
                // Dataset: SECOP II - Contratos Electrónicos (jbjy-vk9h)
                const url = `https://www.datos.gov.co/resource/jbjy-vk9h.json?documento_proveedor=${val}`;
                const resp = await fetch(url);
                const data = await resp.json();

                if(data.length > 0) {
                    st.innerText = `OK: ${data.length} REGISTROS ENCONTRADOS`;
                    dataDiv.innerHTML = data.slice(0, 5).map(i => `
                        <div class="data-card">
                            <table>
                                <tr><td class="label">ENTIDAD:</td><td>${i.nombre_entidad || 'N/A'}</td></tr>
                                <tr><td class="label">VALOR:</td><td>$${Number(i.valor_del_contrato || 0).toLocaleString()}</td></tr>
                                <tr><td class="label">OBJETO:</td><td>${i.descripcion_del_proceso || 'N/A'}</td></tr>
                                <tr><td class="label">ESTADO:</td><td>${i.estado_contrato || 'N/A'}</td></tr>
                            </table>
                        </div>
                    `).join('');
                } else {
                    st.innerText = "TERMINADO: SIN REGISTROS";
                    dataDiv.innerHTML = "<div class='error'>No se encontraron contratos electrónicos para este ID en la API de Datos Abiertos.</div>";
                }
            } catch(e) {
                st.innerText = "ERROR DE CONEXIÓN";
                dataDiv.innerHTML = "<div class='error'>Error al conectar con la API gubernamental. Verifique el ID o intente más tarde.</div>";
            }

            const lks = [
                {n: "SIMIT (MULTAS)", u: `https://fcm.org.co/simit/#/estado-cuenta?numeroDocumento=${val}`},
                {n: "ADRES (SALUD)", u: "https://www.adres.gov.co/consulte-su-eps"}
            ];
            document.getElementById('links').innerHTML = lks.map(l => `<a href="${l.u}" target="_blank" style="color:#00ff41; display:inline-block; margin-right:20px; text-decoration:none;">[${l.n} ↗]</a>`).join('');
        }
    </script>
</body>
</html>
