
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v18.0 — Fix Despliegue</title>
    <style>
        :root { --bg: #030712; --card: #111827; --accent: #ef4444; --text: #f3f4f6; --border: #374151; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .search-box { display: flex; gap: 10px; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        input { flex: 1; background: #1f2937; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .results { display: none; margin-top: 30px; animation: fadeIn 0.5s; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .ia-report { border-left: 4px solid #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .link { background: #1f2937; padding: 10px; border-radius: 6px; text-decoration: none; color: #60a5fa; border: 1px solid var(--border); font-size: 0.9rem; }
        .link:hover { background: var(--border); }
        h3 { margin-top: 0; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .loading { display: none; text-align: center; margin: 20px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ARGOS <span>v18.0</span></h1>
            <p>Suite de Inteligencia OSINT Colombia</p>
        </header>

        <div class="search-box">
            <input type="text" id="q" placeholder="Ingrese Cédula, NIT o Dominio...">
            <button id="scanBtn">ESCANEAR</button>
        </div>

        <div id="loader" class="loading">Iniciando motores de búsqueda...</div>

        <div id="res-container" class="results">
            <div class="card ia-report">
                <h3>🧠 Análisis de Inferencia IA</h3>
                <div id="ia-text"></div>
            </div>

            <div class="card">
                <h3>📂 Enlaces de Consulta Directa</h3>
                <div class="link-grid" id="links"></div>
            </div>

            <div class="card">
                <h3>🛡️ Auditoría Técnica / OSINT</h3>
                <div id="audit" style="font-family: monospace; color: #10b981; background: #000; padding: 15px; border-radius: 8px;"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('scanBtn').onclick = function() {
            const val = document.getElementById('q').value.trim();
            if(!val) { alert("Por favor ingrese un dato"); return; }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('res-container').style.display = 'none';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('res-container').style.display = 'block';

                const lContainer = document.getElementById('links');
                const sources = [
                    {n: "SIMIT (Multas)", u: `https://fcm.org.co/simit/#/estado-cuenta?numeroDocumento=${val}`},
                    {n: "SECOP (Contratos)", u: "https://www.contratos.gov.co/consultas/detalleProceso.do"},
                    {n: "ADRES (Salud)", u: "https://www.adres.gov.co/consulte-su-eps"},
                    {n: "RUES (Cámaras)", u: "https://www.rues.org.co/"},
                    {n: "Procuraduría", u: "https://www.procuraduria.gov.co/Pages/Generacion-de-Certificado-de-Antecedentes.aspx"},
                    {n: "Policía Nacional", u: "https://srvcnpc.policia.gov.co/PSC/frm_cnp_consulta.aspx"}
                ];
                lContainer.innerHTML = sources.map(s => `<a href="${s.u}" target="_blank" class="link">${s.n} ↗</a>`).join('');

                const iaText = document.getElementById('ia-text');
                const isNum = !isNaN(val);
                iaText.innerHTML = isNum 
                    ? `Detectado perfil: <b>PERSONA NATURAL</b>. <br>El ID <b>${val}</b> está siendo procesado en la matriz de contratación estatal y registros de deudores.`
                    : `Detectado perfil: <b>ENTIDAD / RECURSO DIGITAL</b>. <br>Iniciando recolección de huella técnica para <b>${val}</b>.`;

                const audit = document.getElementById('audit');
                audit.innerHTML = isNum 
                    ? `# Perfil: Ciudadano Colombiano<br># No se requieren comandos de red.`
                    : `# Auditoría para: ${val}<br>nmap -Pn -sV ${val}<br>whois ${val}<br>dig ${val} +short`;
            }, 800);
        };
    </script>
</body>
</html>
