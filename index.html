
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v45.0 — SOCIAL ENGINE (BLACKBIRD)</title>
    <style>
        :root { --p: #00ff41; --bg: #050505; --card: #0d0d0f; --border: #1a1a1c; --sky: #00acee; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'JetBrains Mono', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo { padding: 1.5rem; font-weight: 900; color: var(--p); border-bottom: 1px solid var(--border); text-align: center; }
        .nav { flex: 1; padding: 1rem; }
        .nav-item { padding: 12px; margin-bottom: 5px; color: #555; cursor: pointer; font-size: 0.75rem; border-radius: 4px; }
        .nav-item.active { background: #111; color: var(--p); border-left: 3px solid var(--p); }
        .main { flex: 1; display: flex; flex-direction: column; background: #080808; overflow: hidden; }
        .top-bar { height: 60px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1.5rem; justify-content: space-between; }
        .content { flex: 1; padding: 2rem; overflow-y: auto; }
        .search-area { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--p); color: var(--p); padding: 0.8rem; outline: none; }
        button { background: var(--p); color: #000; border: none; padding: 0 1.5rem; font-weight: 900; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .module { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .module-h { padding: 0.6rem; background: #111; border-bottom: 1px solid var(--border); font-size: 0.65rem; color: var(--p); font-weight: bold; }
        .module-b { padding: 1rem; font-size: 0.8rem; }
        .terminal { background: #000; color: #4ade80; padding: 1rem; font-size: 0.7rem; border-radius: 4px; height: 150px; overflow-y: auto; border: 1px solid #111; margin-bottom: 1.5rem; }
        .social-link { display: block; color: var(--sky); text-decoration: none; margin-bottom: 5px; font-size: 0.75rem; }
        .social-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">ARGOS_v45_BLACKBIRD</div>
        <div class="nav">
            <div class="nav-item">OSINT_DASHBOARD</div>
            <div class="nav-item active">SOCIAL_SCANNER</div>
            <div class="nav-item">FORENSIC_MSG</div>
            <div class="nav-item">IP_INTEL</div>
        </div>
    </aside>
    <main class="main">
        <div class="top-bar">
            <div style="font-size:0.75rem">USER: <span style="color:var(--p)">JEISSON_ALBERTO</span></div>
            <div style="font-size:0.65rem">ENGINE: <span style="color:var(--sky)">BLACKBIRD_SOCIAL_RECON</span></div>
        </div>
        <div class="content">
            <div class="search-area">
                <div class="input-group">
                    <input type="text" id="username" placeholder="USERNAME O EMAIL PARA RASTREO EN RRSS...">
                    <button onclick="scanSocial()">ESCANEAR RRSS</button>
                </div>
            </div>
            <div class="terminal" id="log">BLACKBIRD CORE LOADED. READY FOR SOCIAL MEDIA RECONNAISSANCE.</div>
            <div id="results" class="grid"></div>
        </div>
    </main>
    <script>
        async function scanSocial() {
            const user = document.getElementById('username').value.trim();
            if(!user) return;
            const log = document.getElementById('log');
            const res = document.getElementById('results');
            log.innerHTML = `[!] BLACKBIRD: Iniciando rastreo de username: ${user}...<br>[*] Consultando más de 500 redes sociales...`;
            
            // Simulación de los resultados que Blackbird arroja para JeissonAlberto (basado en hallazgos previos)
            setTimeout(() => {
                log.innerHTML += `<br>[+] Búsqueda completada. Se hallaron 6 coincidencias de alta confianza.`;
                res.innerHTML = `
                    <div class="module">
                        <div class="module-h">REDES PROFESIONALES / TECH</div>
                        <div class="module-b">
                            <a href="https://github.com/JeissonAlberto" class="social-link" target="_blank">● GitHub: JeissonAlberto</a>
                            <a href="https://www.linkedin.com/in/jeissonalberto" class="social-link" target="_blank">● LinkedIn: Jeisson Sarmiento</a>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">SOCIAL / ENTRETENIMIENTO</div>
                        <div class="module-b">
                            <a href="https://www.instagram.com/jeissonalberto" class="social-link" target="_blank">● Instagram: @jeissonalberto</a>
                            <a href="https://twitter.com/jeissonalberto" class="social-link" target="_blank">● X/Twitter: @jeissonalberto</a>
                            <a href="https://www.facebook.com/jeissonalberto" class="social-link" target="_blank">● Facebook: Jeisson Sarmiento</a>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">DOMINIOS / OTROS</div>
                        <div class="module-b">
                            <span style="color:#888; font-size:0.7rem;">● Gravatar: jasoll@...</span><br>
                            <span style="color:#888; font-size:0.7rem;">● WordPress: JeissonAlberto Site</span>
                        </div>
                    </div>
                `;
            }, 2000);
        }
    </script>
</body>
</html>
