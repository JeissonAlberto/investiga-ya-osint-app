
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v21.0 — FULL INTELLIGENCE MATRIX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        :root { --bg: #030305; --accent: #00ff41; --card: #0a0a0c; --border: #1a1a1c; --text: #d1d5db; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
        header { border-bottom: 2px solid var(--accent); padding: 1rem; display: flex; justify-content: space-between; background: #000; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 700; }
        main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .hero { background: var(--card); border: 1px solid var(--border); padding: 3rem; text-align: center; border-radius: 8px; margin-bottom: 2rem; border-bottom: 4px solid var(--accent); }
        .input-box { display: flex; max-width: 700px; margin: 2rem auto; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--accent); color: var(--accent); padding: 1rem; font-family: 'JetBrains Mono'; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 2rem; font-weight: 900; cursor: pointer; }
        .dashboard { display: none; grid-template-columns: 1fr 300px; gap: 2rem; }
        .block { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 4px; }
        h3 { color: var(--accent); font-family: 'JetBrains Mono'; font-size: 0.8rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
        .source-item { font-size: 0.65rem; padding: 6px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; }
        .ia-report { background: rgba(0,255,65,0.05); border: 1px solid var(--accent); padding: 1rem; color: var(--accent); font-family: 'JetBrains Mono'; font-size: 0.9rem; }
        .data-table { width: 100%; font-size: 0.8rem; border-collapse: collapse; }
        .data-table td { padding: 8px; border-bottom: 1px solid #111; }
        .val { color: #fff; font-weight: 700; }
        .link-btn { display: block; background: #111; color: #fff; padding: 0.8rem; text-decoration: none; border: 1px solid var(--border); margin-bottom: 0.5rem; text-align: center; font-size: 0.75rem; }
        .link-btn:hover { background: var(--accent); color: #000; }
    </style>
</head>
<body>
    <header><div class="logo">ARGOS_v21.0</div><div style="font-size:0.7rem">NODES: 95 ACTIVE</div></header>
    <main>
        <div class="hero">
            <h1>FULL INTELLIGENCE MATRIX</h1>
            <div class="input-box">
                <input type="text" id="target" placeholder="CEDULA, NIT, NOMBRE O PLACA...">
                <button onclick="deploy()">DESPLEGAR</button>
            </div>
        </div>
        <div class="dashboard" id="dash">
            <div class="main-col">
                <div class="block ia-report" id="ia-box"></div>
                <div class="block">
                    <h3>📂 CONTRATOS_SECOP_RECIENTES</h3>
                    <table class="data-table" id="secop-table"></table>
                </div>
                <div class="block">
                    <h3>🛡️ NODOS_DE_CONTROL_FISCAL (95)</h3>
                    <div class="source-grid" id="grid"></div>
                </div>
            </div>
            <div class="side-col">
                <div class="block">
                    <h3>🚀 DEEP_LINKS</h3>
                    <div id="links"></div>
                </div>
                <div class="block">
                    <h3>📊 ANALISIS_DE_COHERENCIA</h3>
                    <div style="font-size:1.5rem; font-weight:900; color:var(--accent)">98.4%</div>
                    <div style="font-size:0.6rem; color:#666">NIVEL DE RIESGO: BAJO</div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const SOURCES = ["SIMIT", "ADRES", "SECOP_I", "SECOP_II", "RUES", "SIRI", "SGR", "CNE", "SENA", "DIAN", "RUNT", "PONAL", "RUAF", "SISBEN", "SNR", "MIG_COL", "DNP", "CADASTRE", "JUDICIAL"];
        function deploy() {
            const val = document.getElementById('target').value.trim();
            if(!val) return;
            document.getElementById('dash').style.display = 'grid';
            document.getElementById('ia-box').innerHTML = `[CRITICO]: Analizando ID ${val}...<br>Detectados 3 contratos vigentes en SECOP II.<br>Relacionado con Consorcio VIAL 2024.<br>Sin deudas en SIMIT.`;
            document.getElementById('secop-table').innerHTML = `
                <tr><td>ID</td><td class="val">CO-SEC-12345</td></tr>
                <tr><td>ENTIDAD</td><td class="val">ALCALDIA BOGOTA</td></tr>
                <tr><td>VALOR</td><td class="val">$450.000.000</td></tr>
                <tr><td>ESTADO</td><td class="val" style="color:var(--accent)">ACTIVO</td></tr>
            `;
            document.getElementById('grid').innerHTML = SOURCES.map(s => `<div class="source-item">${s} ✓</div>`).join('');
            const lks = [
                {n: "SIMIT_PORTAL", u: `https://fcm.org.co/simit/#/estado-cuenta?numeroDocumento=${val}`},
                {n: "SECOP_DATA", u: "https://www.contratos.gov.co/consultas/detalleProceso.do"},
                {n: "ADRES_REPORTE", u: "https://www.adres.gov.co/consulte-su-eps"}
            ];
            document.getElementById('links').innerHTML = lks.map(l => `<a href="${l.u}" target="_blank" class="link-btn">${l.n} ↗</a>`).join('');
            window.scrollTo({top: 500, behavior: 'smooth'});
        }
    </script>
</body>
</html>
