
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v30.0 — SISTEMA PROFESIONAL DE INTELIGENCIA</title>
    <style>
        :root { --p: #00ff41; --bg: #050505; --card: #0d0d0f; --border: #1a1a1c; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        header { padding: 1rem; background: #000; border-bottom: 2px solid var(--p); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: monospace; color: var(--p); font-weight: 700; }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .hero { background: var(--card); border: 1px solid var(--border); padding: 3rem; text-align: center; border-radius: 8px; margin-bottom: 2rem; }
        .input-group { display: flex; max-width: 600px; margin: 1.5rem auto; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--p); color: var(--p); padding: 1rem; outline: none; }
        button { background: var(--p); color: #000; border: none; padding: 0 2rem; font-weight: 900; cursor: pointer; }
        .dashboard { display: none; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .panel { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1rem; }
        h3 { color: var(--p); font-size: 0.8rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; }
        .report-box { background: #000; border-left: 3px solid var(--p); padding: 1.5rem; }
        .log { font-family: monospace; font-size: 0.7rem; color: #4ade80; background: #000; padding: 10px; height: 100px; overflow: auto; border: 1px solid #222; }
    </style>
</head>
<body>
    <header><div class="logo">ARGOS_v30.0_FINAL</div></header>
    <main>
        <div class="hero">
            <h1>SISTEMA DE INTELIGENCIA REAL</h1>
            <div class="input-group">
                <input type="text" id="q" placeholder="CEDULA O NIT...">
                <button onclick="investigar()">EJECUTAR</button>
            </div>
        </div>
        <div id="dash" class="dashboard">
            <div class="main-col">
                <div class="panel"><h3>INFORME DE INTELIGENCIA</h3><div id="report" class="report-box"></div></div>
            </div>
            <div class="side-col">
                <div class="panel"><h3>AGENTE AUTONOMO (PAGE-AGENT CORE)</h3><div id="log" class="log"></div></div>
            </div>
        </div>
    </main>
    <script>
        async function investigar() {
            const v = document.getElementById('q').value;
            if(!v) return;
            document.getElementById('dash').style.display = 'grid';
            const log = document.getElementById('log');
            log.innerHTML = "[*] Iniciando Page-Agent...<br>[*] Conectando a SECOP II API...";
            try {
                const r = await fetch(`https://www.datos.gov.co/resource/jbjy-vk9h.json?documento_proveedor=${v}`);
                const d = await r.json();
                if(d.length > 0) {
                    log.innerHTML += `<br>[+] ${d.length} registros hallados.`;
                    document.getElementById('report').innerHTML = `<b>OBJETIVO HALLADO:</b> ${d[0].nombre_entidad}<br><b>MONTO:</b> $${Number(d[0].valor_del_contrato).toLocaleString()}<br><b>ESTADO:</b> ${d[0].estado_contrato}`;
                } else {
                    document.getElementById('report').innerHTML = "Sin registros en SECOP II. Procediendo a nodos de movilidad.";
                }
            } catch(e) { log.innerHTML += "<br>[!] Error en nodo central."; }
        }
    </script>
</body>
</html>
