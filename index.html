
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ARGOS v41.0 — NETWORK INTELLIGENCE CORE</title>
    <style>
        :root { --p: #00ff41; --bg: #050505; --card: #0d0d0f; --border: #1a1a1c; --warn: #ffcc00; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'JetBrains Mono', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo { padding: 1.5rem; font-weight: 900; color: var(--p); border-bottom: 1px solid var(--border); text-align: center; letter-spacing: 2px; }
        .nav { flex: 1; padding: 1rem; }
        .nav-item { padding: 10px; margin-bottom: 5px; color: #555; cursor: pointer; font-size: 0.75rem; border-radius: 4px; transition: 0.3s; }
        .nav-item.active { background: #111; color: var(--p); border-left: 3px solid var(--p); }
        .main { flex: 1; display: flex; flex-direction: column; background: #080808; overflow: hidden; }
        .top-bar { height: 60px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1.5rem; justify-content: space-between; }
        .content { flex: 1; padding: 2rem; overflow-y: auto; }
        .search-area { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--p); color: var(--p); padding: 0.8rem; outline: none; }
        button { background: var(--p); color: #000; border: none; padding: 0 1.5rem; font-weight: 900; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
        .module { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .module-h { padding: 0.6rem; background: #111; border-bottom: 1px solid var(--border); font-size: 0.65rem; color: var(--p); font-weight: bold; }
        .module-b { padding: 1rem; font-size: 0.8rem; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #1a1a1c; padding-bottom: 4px; }
        .label { color: #64748b; font-size: 0.7rem; }
        .val { color: #fff; font-weight: 600; }
        .log { background: #000; color: #4ade80; padding: 1rem; font-size: 0.7rem; border-radius: 4px; border: 1px solid #111; height: 100px; overflow-y: auto; margin-top: 1rem; }
        .risk-badge { padding: 2px 6px; border-radius: 2px; font-weight: bold; font-size: 0.6rem; }
        .risk-low { background: #00ff41; color: #000; }
        .risk-high { background: #ff3e3e; color: #fff; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">ARGOS_v41_INTEL</div>
        <div class="nav">
            <div class="nav-item">● OSINT_CRM</div>
            <div class="nav-item active">● IP_INTELLIGENCE</div>
            <div class="nav-item">● VULN_AUDIT</div>
            <div class="nav-item">● NODE_MAP</div>
        </div>
    </aside>
    <main class="main">
        <div class="top-bar">
            <div style="font-size:0.75rem">OPERADOR: <span style="color:var(--p)">JEISSON_ALBERTO</span></div>
            <div style="font-size:0.65rem">ENGINE: <span style="color:var(--p)">IPQUERY_INTEGRATED</span></div>
        </div>
        <div class="content">
            <div class="search-area">
                <div class="input-group">
                    <input type="text" id="ip" placeholder="INGRESAR DIRECCIÓN IP PARA RASTREO TÁCTICO...">
                    <button onclick="scanIP()">RASTREAR</button>
                </div>
            </div>
            <div id="results" class="grid"></div>
            <div class="log" id="log">SISTEMA IPQUERY INTEGRADO. LISTO PARA ESCANEO DE RED.</div>
        </div>
    </main>
    <script>
        async function scanIP() {
            const ip = document.getElementById('ip').value.trim();
            if(!ip) return;
            const log = document.getElementById('log');
            const res = document.getElementById('results');
            log.innerHTML = `[*] Conectando a IPQuery.io API...<br>[*] Escaneando IP: ${ip}`;
            try {
                const response = await fetch(`https://api.ipquery.io/${ip}`);
                const data = await response.json();
                log.innerHTML += `<br>[+] Datos de inteligencia de red recibidos.`;
                res.innerHTML = `
                    <div class="module">
                        <div class="module-h">LOCALIZACIÓN GEOGRÁFICA</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">PAÍS:</span><span class="val">${data.location.country} (${data.location.country_code})</span></div>
                            <div class="data-row"><span class="label">CIUDAD:</span><span class="val">${data.location.city}</span></div>
                            <div class="data-row"><span class="label">ESTADO:</span><span class="val">${data.location.state}</span></div>
                            <div class="data-row"><span class="label">COORDENADAS:</span><span class="val">${data.location.latitude}, ${data.location.longitude}</span></div>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">INFRAESTRUCTURA ISP</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">ASN:</span><span class="val">${data.isp.asn}</span></div>
                            <div class="data-row"><span class="label">ORG:</span><span class="val">${data.isp.org}</span></div>
                            <div class="data-row"><span class="label">ISP:</span><span class="val">${data.isp.isp}</span></div>
                        </div>
                    </div>
                    <div class="module">
                        <div class="module-h">PUNTUACIÓN DE RIESGO</div>
                        <div class="module-b">
                            <div class="data-row"><span class="label">RIESGO TOTAL:</span><span class="val"><span class="risk-badge ${data.risk.risk_score > 50 ? 'risk-high' : 'risk-low'}">${data.risk.risk_score}/100</span></span></div>
                            <div class="data-row"><span class="label">VPN:</span><span class="val">${data.risk.is_vpn ? 'SÍ' : 'NO'}</span></div>
                            <div class="data-row"><span class="label">TOR:</span><span class="val">${data.risk.is_tor ? 'SÍ' : 'NO'}</span></div>
                            <div class="data-row"><span class="label">PROXY:</span><span class="val">${data.risk.is_proxy ? 'SÍ' : 'NO'}</span></div>
                        </div>
                    </div>
                `;
            } catch(e) {
                log.innerHTML += `<br>[!] Error en la conexión con el nodo IPQuery.`;
            }
        }
    </script>
</body>
</html>
