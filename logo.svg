<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Fondo gradiente oscuro -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <!-- Gradiente cyan-purple para elementos principales -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Gradiente para el mango de la lupa -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00d4ff" flood-opacity="0.25"/>
    </filter>
    <!-- Clip circle para el reflejo -->
    <clipPath id="circleClip">
      <circle cx="82" cy="82" r="46"/>
    </clipPath>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>

  <!-- Borde sutil -->
  <rect width="200" height="200" rx="36" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Círculos de fondo decorativos (radar) -->
  <circle cx="82" cy="82" r="70" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.12"/>
  <circle cx="82" cy="82" r="55" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <circle cx="82" cy="82" r="40" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.08"/>

  <!-- === LUPA === -->
  <!-- Relleno de la lupa (vidrio) -->
  <circle cx="82" cy="82" r="46" fill="#091525" opacity="0.95" filter="url(#shadow)"/>

  <!-- Aro exterior de la lupa con gradiente -->
  <circle cx="82" cy="82" r="46" fill="none" stroke="url(#grad1)" stroke-width="9" filter="url(#glow)"/>

  <!-- Reflejo brillante en el vidrio -->
  <ellipse cx="66" cy="64" rx="14" ry="9" fill="white" opacity="0.06" transform="rotate(-30 66 64)" clip-path="url(#circleClip)"/>

  <!-- Líneas de escaneo dentro de la lupa (estilo investigación digital) -->
  <g clip-path="url(#circleClip)" opacity="0.18">
    <line x1="36" y1="72" x2="128" y2="72" stroke="#00d4ff" stroke-width="1"/>
    <line x1="36" y1="82" x2="128" y2="82" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="36" y1="92" x2="128" y2="92" stroke="#00d4ff" stroke-width="1"/>
  </g>

  <!-- Punto central / objetivo -->
  <circle cx="82" cy="82" r="5" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="82" cy="82" r="1.5" fill="#00d4ff" opacity="0.8"/>

  <!-- Mira (crosshair) sutil -->
  <line x1="82" y1="64" x2="82" y2="72" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="82" y1="92" x2="82" y2="100" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="64" y1="82" x2="72" y2="82" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <line x1="92" y1="82" x2="100" y2="82" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>

  <!-- Mango de la lupa -->
  <line x1="118" y1="118" x2="154" y2="156" stroke="url(#grad2)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Highlight en el mango -->
  <line x1="117" y1="117" x2="153" y2="155" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.15"/>

  <!-- === TEXTO === -->
  <!-- "INVESTIGA" -->
  <text x="100" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="800" fill="url(#grad1)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">INVESTIGA</text>
  <!-- "YA" con color sólido blanco/cyan -->
  <text x="100" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#557090" text-anchor="middle" letter-spacing="4">OSINT · COL</text>
</svg>
