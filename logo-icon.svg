<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cc">
      <circle cx="26" cy="26" r="15"/>
    </clipPath>
  </defs>
  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Aro lupa -->
  <circle cx="26" cy="26" r="15" fill="#091525"/>
  <circle cx="26" cy="26" r="15" fill="none" stroke="url(#g1)" stroke-width="3.5" filter="url(#glow)"/>
  <!-- Scanlines -->
  <g clip-path="url(#cc)" opacity="0.2">
    <line x1="11" y1="22" x2="41" y2="22" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="11" y1="26" x2="41" y2="26" stroke="#00d4ff" stroke-width="1.2"/>
    <line x1="11" y1="30" x2="41" y2="30" stroke="#00d4ff" stroke-width="0.8"/>
  </g>
  <!-- Punto central -->
  <circle cx="26" cy="26" r="2" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <circle cx="26" cy="26" r="0.7" fill="#00d4ff"/>
  <!-- Mango -->
  <line x1="37" y1="37" x2="50" y2="51" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="37" y1="37" x2="50" y2="51" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.15"/>
</svg>
